<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>SellerOS 관리자 로그인</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">

</head>

<body>

<div class="login-card">

    <h1>SellerOS</h1>

    <h3>관리자 로그인</h3>

    <form action="/admin_auth" method="POST">

        <input
            type="text"
            name="admin_id"
            placeholder="아이디"
            autofocus
            required>

        <input
            type="password"
            name="admin_pw"
            placeholder="비밀번호"
            required>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <button type="submit">

            로그인

        </button>

    </form>

</div>

</body>

</html>
