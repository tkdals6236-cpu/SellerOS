<form action="/admin_auth" method="POST">

    <input
        type="text"
        name="admin_id"
        placeholder="아이디"
        required>

    <input
        type="password"
        name="admin_pw"
        placeholder="비밀번호"
        required>

    <button type="submit">
        로그인
    </button>

</form>

{% if error %}
<p class="login-error">{{ error }}</p>
{% endif %}
